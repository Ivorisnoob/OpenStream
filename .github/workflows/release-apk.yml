name: Build signed release APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        shell: bash
        env:
          OPENSTREAM_KEYSTORE_BASE64: ${{ secrets.OPENSTREAM_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$OPENSTREAM_KEYSTORE_BASE64" ]]; then
            echo "Missing required GitHub Actions secret: OPENSTREAM_KEYSTORE_BASE64" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/openstream-release.jks"
          printf '%s' "$OPENSTREAM_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

      - name: Build signed universal release APK
        shell: bash
        env:
          OPENSTREAM_KEYSTORE_PATH: ${{ runner.temp }}/openstream-release.jks
          OPENSTREAM_KEYSTORE_PASSWORD: ${{ secrets.OPENSTREAM_KEYSTORE_PASSWORD }}
          OPENSTREAM_KEY_ALIAS: ${{ secrets.OPENSTREAM_KEY_ALIAS }}
          OPENSTREAM_KEY_PASSWORD: ${{ secrets.OPENSTREAM_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          for variable in \
            OPENSTREAM_KEYSTORE_PASSWORD \
            OPENSTREAM_KEY_ALIAS \
            OPENSTREAM_KEY_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required GitHub Actions secret: $variable" >&2
              exit 1
            fi
          done

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/openstream-artifact"
          cp app/build/outputs/apk/release/app-universal-release.apk \
            "$RUNNER_TEMP/openstream-artifact/OpenStream-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenStream-release-${{ github.sha }}
          path: ${{ runner.temp }}/openstream-artifact/OpenStream-release.apk
          if-no-files-found: error
          retention-days: 14
